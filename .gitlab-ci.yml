stages:
  - renovate
  - build
  - test
  - provenance   # SLSA: 成果物への署名付き provenance 生成
  - verify        # SLSA: provenance 検証と VSA 生成
  - pages
  - deploy

image: docker:git
services:
- docker:dind

build-job:      # 実際に jar をビルドし、SLSA provenance の署名対象とする
  stage: build
  image: eclipse-temurin:17.0.19_10-jdk
  variables:
    # SLSA provenance 生成に必須。未設定だと artifacts-metadata.json が作られず署名が失敗する
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  script:
    - ./mvnw -B -DskipTests package
  artifacts:
    paths:
      - target/spring-petclinic-*.jar

deploy-job:      # This job runs in the deploy stage.
  stage: deploy
  script:
    - echo "Deploying application..."


# ---------------------------------------------------------------------------
# SLSA コンポーネント (provenance-signer / provenance-verifier @0.1.1) の
# before_script 上書き。コンポーネント本体は変更できないため、環境依存で壊れる
# ツール導入部だけを差し替えて互換性を確保する (詳細は下のアンカーのコメント)。
# ---------------------------------------------------------------------------
.install-slsa-tools: &install-slsa-tools
  # cosign: apk の cosign は 3.x で --fulcio-url/--rekor-url が使えないため 2.x をピン留め。
  # jq:     apk (Wolfi) の jq は opa イメージより新しい glibc を要求し実行時に壊れるため、
  #         静的バイナリを使う。curl のみ apk で導入する。
  # /usr/local/bin は Wolfi ベースの opa イメージには存在しないため事前作成する。
  - apk add --update curl
  - mkdir -p /usr/local/bin
  - curl -sSfL "https://github.com/sigstore/cosign/releases/download/v2.6.3/cosign-linux-amd64" -o /usr/local/bin/cosign
  - curl -sSfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /usr/local/bin/jq
  - chmod +x /usr/local/bin/cosign /usr/local/bin/jq

generate_provenance:
  before_script:
    - *install-slsa-tools
    - mkdir -p $(dirname ${BUNDLE_FILE})

verify_provenance:
  before_script:
    - *install-slsa-tools
    - mkdir .tmp


renovate:
  stage: renovate
  image: renovate/renovate:latest
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4
    RENOVATE_REPOSITORIES: "gl-demo-ultimate-nsasaki/app/java/spring-petclinic"
    LOG_LEVEL: debug
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  tags: []


include:
  # SLSA Level 1: GitLab 公式 SLSA コンポーネント (gitlab.com/components/slsa)
  # provenance-signer が成果物に署名付き provenance を生成 (Sigstore Cosign キーレス署名)
  # NOTE: target_artifact は pom.xml のバージョン更新時に合わせて更新すること
  - component: $CI_SERVER_FQDN/components/slsa/provenance-signer@0.1.1
    inputs:
      target_artifact: target/spring-petclinic-3.5.0-SNAPSHOT.jar
      stage: provenance
  # provenance-verifier がパイプライン内で provenance を検証し VSA を生成
  # resource_url は curl でダウンロードする URL として扱われるため、ローカルの
  # ファイルパスではなく file:// スキームで build-job の成果物 (artifacts で
  # ワークスペースに取得済み) を指す。$CI_PROJECT_DIR は expand_vars で展開される。
  - component: $CI_SERVER_FQDN/components/slsa/provenance-verifier@0.1.1
    inputs:
      resource_url: file://$CI_PROJECT_DIR/target/spring-petclinic-3.5.0-SNAPSHOT.jar
      bundle_file: provenance.json
      stage: verify
  - template: Jobs/Code-Intelligence.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - component: $CI_SERVER_FQDN/components/code-quality-oss/codequality-os-scanners-integration/convert-to-sast@1.6.0



