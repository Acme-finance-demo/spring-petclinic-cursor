stages:
  - build
  - test
  - security     # Trivy 依存関係スキャン
  - provenance   # SLSA: 成果物への署名付き provenance 生成
  - verify        # SLSA: provenance 検証と VSA 生成
  - pages
  - deploy
  - automate     # Cursor Cloud Agent（Tokyo weather / Trivy 修正など）を webhook で起動

image: docker:git
services:
- docker:dind

build-job:      # 実際に jar をビルドし、SLSA provenance の署名対象とする
  stage: build
  image: eclipse-temurin:17.0.19_10-jdk
  variables:
    # SLSA provenance 生成に必須。未設定だと artifacts-metadata.json が作られず署名が失敗する
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  script:
    - ./mvnw -B -DskipTests package
  artifacts:
    paths:
      - target/spring-petclinic-*.jar

deploy-job:      # This job runs in the deploy stage.
  stage: deploy
  script:
    - echo "Deploying application..."

# Trivy: 依存関係の脆弱性スキャン
# build-job の JAR を含めてスキャンし、解決済み依存も対象にする。
# Trivy 単体だと Maven Central へ POM 取得しに行き shared runner で 429 になりやすいため、
# 先に ./mvnw dependency:resolve で ~/.m2 を埋めてからスキャンする。
trivy-dependency-scan:
  stage: security
  image: eclipse-temurin:17.0.19_10-jdk
  needs:
    - job: build-job
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"
        | tar -xz -C /usr/local/bin trivy
    - curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/gitlab.tpl"
        -o /tmp/gitlab.tpl
    - ./mvnw -B -DskipTests dependency:resolve
  script:
    - trivy fs --scanners vuln --severity CRITICAL
        --format template --template "@/tmp/gitlab.tpl"
        --output gl-trivy-fs-report.json .
    # レポートは出すが、CRITICAL 検出でもジョブは失敗させない
    - trivy fs --scanners vuln --severity CRITICAL
        --exit-code 0 --format table .
  artifacts:
    when: always
    paths:
      - gl-trivy-fs-report.json
    reports:
      # Trivy 付属 gitlab.tpl は container_scanning スキーマ向け
      container_scanning: gl-trivy-fs-report.json
  allow_failure: true

# GitLab には Cursor Automation の「CI completed」トリガーがないため、
# パイプラインから Automation webhook へ POST して Cloud Agent を起動する。
# 変数未設定ならジョブ自体を作らない。
# 手順とプロンプト: .cursor/automations/tokyo-weather.md
trigger-tokyo-weather-agent:
  stage: automate
  image: alpine:3.21
  needs:
    - job: build-job
      optional: true
  rules:
    - if: '$CURSOR_AUTOMATION_WEBHOOK_URL && $CURSOR_AUTOMATION_API_KEY'
  script:
    - apk add --no-cache curl
    - |
      curl -fsS -X POST "$CURSOR_AUTOMATION_WEBHOOK_URL" \
        -H "Authorization: Bearer ${CURSOR_AUTOMATION_API_KEY}" \
        -H "Content-Type: application/json" \
        -d "{\"source\":\"gitlab-ci\",\"project\":\"${CI_PROJECT_PATH}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"ref\":\"${CI_COMMIT_REF_NAME}\",\"sha\":\"${CI_COMMIT_SHA}\"}"

# Trivy レポートを Cursor Automation（Cloud Agent）へ渡し、依存修正 MR を依頼する。
# 手順とプロンプト: .cursor/automations/trivy-remediation.md
trigger-trivy-agent:
  stage: automate
  image: alpine:3.21
  needs:
    - job: trivy-dependency-scan
      artifacts: true
  rules:
    - if: '$CURSOR_TRIVY_WEBHOOK_URL && $CURSOR_TRIVY_API_KEY'
  script:
    - apk add --no-cache curl jq
    - |
      if [ ! -f gl-trivy-fs-report.json ]; then
        echo "No Trivy report artifact; skipping webhook"
        exit 0
      fi
      COUNT=$(jq '.vulnerabilities | length' gl-trivy-fs-report.json)
      echo "Trivy vulnerability_count=${COUNT}"
      if [ "${COUNT}" -eq 0 ]; then
        echo "No vulnerabilities; skipping webhook"
        exit 0
      fi
      jq -n \
        --slurpfile report gl-trivy-fs-report.json \
        --arg source "gitlab-ci" \
        --arg project "${CI_PROJECT_PATH}" \
        --arg pipeline_id "${CI_PIPELINE_ID}" \
        --arg pipeline_url "${CI_PIPELINE_URL}" \
        --arg ref "${CI_COMMIT_REF_NAME}" \
        --arg sha "${CI_COMMIT_SHA}" \
        '{
          source: $source,
          project: $project,
          pipeline_id: $pipeline_id,
          pipeline_url: $pipeline_url,
          ref: $ref,
          sha: $sha,
          vulnerability_count: ($report[0].vulnerabilities | length),
          vulnerabilities: [
            $report[0].vulnerabilities[] | {
              id, severity, name, description, solution,
              package: .location.dependency.package.name,
              version: .location.dependency.version
            }
          ],
          trivy_report: $report[0]
        }' > /tmp/trivy-webhook-payload.json
      curl -fsS -X POST "$CURSOR_TRIVY_WEBHOOK_URL" \
        -H "Authorization: Bearer ${CURSOR_TRIVY_API_KEY}" \
        -H "Content-Type: application/json" \
        -d @/tmp/trivy-webhook-payload.json


# ---------------------------------------------------------------------------
# SLSA コンポーネント (provenance-signer / provenance-verifier @0.1.1) の
# before_script 上書き。コンポーネント本体は変更できないため、環境依存で壊れる
# ツール導入部だけを差し替えて互換性を確保する (詳細は下のアンカーのコメント)。
# ---------------------------------------------------------------------------
.install-slsa-tools: &install-slsa-tools
  # cosign: apk の cosign は 3.x で --fulcio-url/--rekor-url が使えないため 2.x をピン留め。
  # jq:     apk (Wolfi) の jq は opa イメージより新しい glibc を要求し実行時に壊れるため、
  #         静的バイナリを使う。curl のみ apk で導入する。
  # /usr/local/bin は Wolfi ベースの opa イメージには存在しないため事前作成する。
  - apk add --update curl
  - mkdir -p /usr/local/bin
  - curl -sSfL "https://github.com/sigstore/cosign/releases/download/v2.6.3/cosign-linux-amd64" -o /usr/local/bin/cosign
  - curl -sSfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /usr/local/bin/jq
  - chmod +x /usr/local/bin/cosign /usr/local/bin/jq





