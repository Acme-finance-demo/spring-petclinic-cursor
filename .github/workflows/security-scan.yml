# .gitlab-ci.yml の build / security / automate ステージの GitHub Actions 版。
# Trivy でスキャン → Cursor SDK オーケストレータが triage → policy → 修正 PR → 影響分析。
# スキャンで検出してもワークフローは失敗させない（自動修正するかは policy.ts が決める）。
name: security

on:
  push:
    branches-ignore:
      # エージェントが作った修正ブランチで再度オーケストレータを回さない。
      # 修正ブランチの build / scan は下の pull_request トリガーで走る。
      - "cursor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 実際に jar をビルドする。
  # SLSA provenance 相当が必要なら actions/attest-build-provenance を足す
  # （GitLab 側は RUNNER_GENERATE_ARTIFACTS_METADATA + provenance-signer コンポーネント）。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: target/spring-petclinic-*.jar
          if-no-files-found: error

  # Trivy: 依存関係の脆弱性スキャン。
  # Trivy 単体だと Maven Central へ POM を取りに行って 429 になりやすいため、
  # 先に ./mvnw dependency:resolve で ~/.m2 を埋めてからスキャンする。
  # JAR 自体は --skip-dirs target で対象外なので artifact は取り込まない（build の成功待ちだけ）。
  trivy-dependency-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # SARIF を Code scanning（Security タブ）へ上げるために必要
      security-events: write
    env:
      # TRIVY_ 接頭辞は Trivy 自身のフラグ（TRIVY_VERSION → --version など）に
      # 解釈されるため、あえて SCAN_ 接頭辞にしている。
      SCAN_TRIVY_VERSION: 0.74.0
      SCAN_FLAGS: >-
        --scanners vuln --severity CRITICAL,HIGH,MEDIUM
        --skip-dirs target --skip-dirs cursor-sdk --skip-dirs node_modules --skip-dirs .git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${SCAN_TRIVY_VERSION}/trivy_${SCAN_TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      # DB は ghcr から引くのでレート制限に当たりやすい。run ごとに保存して前回分を復元する。
      - name: Cache the Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Resolve Maven dependencies
        run: ./mvnw -B -DskipTests dependency:resolve
      # オーケストレータの入力。GitLab CI と同じファイル名を使う。
      - name: Scan (JSON, orchestrator input)
        run: trivy fs ${SCAN_FLAGS} --format json --output gl-trivy-fs-report.json .
      - name: Scan (SARIF for Code scanning)
        run: trivy fs ${SCAN_FLAGS} --format sarif --output trivy-results.sarif .
      # 検出してもジョブは失敗させない。ログで読める形も残す。
      - name: Scan (table for the log)
        run: trivy fs ${SCAN_FLAGS} --exit-code 0 --format table .
      # private リポジトリで Code scanning が無効だと 403 になるため落とさない。
      - name: Upload SARIF to Code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            gl-trivy-fs-report.json
            trivy-results.sarif
          if-no-files-found: warn

  # Trivy レポートを Cursor SDK オーケストレータへ渡す。
  # CURSOR_API_KEY は Cursor Dashboard の user / service-account キー
  # （Settings → Secrets and variables → Actions に登録する）。
  # secrets コンテキストは job の if: で読めないため、最初のステップで見て以降を分岐する。
  sdk-vuln-orchestrator:
    runs-on: ubuntu-latest
    needs: trivy-dependency-scan
    # 修正 PR を開くのは push と手動実行のときだけ（PR の CI では回さない）
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    # allow_failure 相当。オーケストレータが落ちてもマージは止めない
    continue-on-error: true
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # SHA ではなくブランチ名。Cursor の ref 検証は push 直後のコミット SHA を
      # 解決できず validation_error になることがあるが、ブランチ名なら通る。
      # 冪等キーには GITHUB_SHA を使うので、run ごとの重複起動は防げる。
      CURSOR_STARTING_REF: ${{ github.ref_name }}
      VULN_RUNTIME: cloud
    steps:
      - name: Check for CURSOR_API_KEY
        id: guard
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is not set; skipping the SDK orchestrator"
            echo "CURSOR_API_KEY is not set; skipped the SDK orchestrator." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          name: trivy-report
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cursor-sdk/package-lock.json
      - name: Triage, policy, fix PR, impact analysis
        if: steps.guard.outputs.enabled == 'true'
        working-directory: cursor-sdk
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/gl-trivy-fs-report.json" ]; then
            echo "No Trivy report artifact; skipping SDK orchestrator"
            exit 0
          fi
          npm ci
          npx tsx src/cli.ts run --report "$GITHUB_WORKSPACE/gl-trivy-fs-report.json" --runtime cloud
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.enabled == 'true'
        with:
          name: vuln-orchestrator-state
          path: .cursor/vuln-orchestrator-state.json
          if-no-files-found: ignore
