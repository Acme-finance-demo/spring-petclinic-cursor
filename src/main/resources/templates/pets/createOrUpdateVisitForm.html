<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" id="success-message" role="alert">
    <span th:text="${message}" th:remove="tag"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" id="error-message" role="alert">
    <span th:text="${error}" th:remove="tag"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <h3 th:text="#{pet}">Pet</h3>
  <div class="table-responsive mb-3">
    <table class="table table-striped">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{birthDate}">Birth Date</th>
          <th th:text="#{type}">Type</th>
          <th th:text="#{owner}">Owner</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td th:text="${pet.name}"></td>
          <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
          <td th:text="${pet.type}"></td>
          <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <form th:object="${visit}" class="form-horizontal" method="post">
    <input th:replace="~{fragments/inputField :: input (#{date}, 'date', 'date')}" />
    <input th:replace="~{fragments/inputField :: input (#{description}, 'description', 'text')}" />
    <div class="mb-3 row">
      <div class="col-sm-10 offset-sm-2">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
      </div>
    </div>
  </form>

  <h3 th:text="#{previousVisits}">Previous Visits</h3>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th th:text="#{date}">Date</th>
          <th th:text="#{description}">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
          <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
          <td th:text="${visit.description}"></td>
        </tr>
        <tr th:if="${visit['new'] or #lists.isEmpty(pet.visits)}">
          <td colspan="2" class="text-muted fst-italic">No previous visits</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    (function () {
      var successMsg = document.getElementById("success-message");
      var errorMsg = document.getElementById("error-message");
      setTimeout(function () {
        if (successMsg) successMsg.style.display = "none";
        if (errorMsg) errorMsg.style.display = "none";
      }, 3000);
    })();
  </script>
</body>

</html>
