<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{owners}">Owners</h2>

  <div class="table-responsive">
    <table id="owners" class="table table-striped table-hover">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td>
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
          </td>
          <td th:text="${owner.address}"></td>
          <td th:text="${owner.city}"></td>
          <td th:text="${owner.telephone}"></td>
          <td><span th:text="${#strings.listJoin(owner.pets, ', ')}"></span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${totalPages > 1}" aria-label="#{pages}">
    <ul class="pagination justify-content-center flex-wrap">
      <li th:classappend="${currentPage == 1} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/owners?page=1'}" th:title="#{first}" aria-label="#{first}">
          <span class="fa fa-fast-backward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:classappend="${currentPage == 1} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/owners?page=__${currentPage - 1}__'}" th:title="#{previous}" aria-label="#{previous}">
          <span class="fa fa-step-backward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:each="i: ${#numbers.sequence(1, totalPages)}"
          th:classappend="${currentPage == i} ? 'active'" class="page-item">
        <a class="page-link" th:href="@{'/owners?page=' + ${i}}" th:text="${i}">1</a>
      </li>
      <li th:classappend="${currentPage == totalPages} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/owners?page=__${currentPage + 1}__'}" th:title="#{next}" aria-label="#{next}">
          <span class="fa fa-step-forward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:classappend="${currentPage == totalPages} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/owners?page=__${totalPages}__'}" th:title="#{last}" aria-label="#{last}">
          <span class="fa fa-fast-forward" aria-hidden="true"></span>
        </a>
      </li>
    </ul>
  </nav>

</body>

</html>
