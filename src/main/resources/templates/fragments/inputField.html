<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <form>
    <th:block th:fragment="input (label, name, type)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
           th:class="${'mb-3 row' + (valid ? '' : ' has-error')}">
        <label th:for="${name}" class="col-sm-2 col-form-label fw-semibold" th:text="${label}">Label</label>
        <div class="col-sm-10">
          <div th:switch="${type}">
            <input th:case="'text'" class="form-control" type="text" th:field="*{__${name}__}"
                   th:classappend="${valid ? '' : ' is-invalid'}" />
            <input th:case="'date'" class="form-control" type="date" th:field="*{__${name}__}"
                   th:classappend="${valid ? '' : ' is-invalid'}" />
          </div>
          <th:block th:if="${!valid}">
            <div class="invalid-feedback d-block" th:errors="*{__${name}__}" th:text="#{error}">Error</div>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>

</html>
