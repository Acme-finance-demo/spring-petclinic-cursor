<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <div class="table-responsive">
    <table id="vets" class="table table-striped table-hover">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{specialties}">Specialties</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${listVets}">
          <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
          <td>
            <span th:each="specialty : ${vet.specialties}" class="badge bg-secondary me-1" th:text="${specialty.name}"></span>
            <span th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}" class="text-muted fst-italic">none</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${totalPages > 1}" aria-label="#{pages}">
    <ul class="pagination justify-content-center flex-wrap">
      <li th:classappend="${currentPage == 1} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/vets.html?page=1'}" th:title="#{first}" aria-label="#{first}">
          <span class="fa fa-fast-backward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:classappend="${currentPage == 1} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/vets.html?page=__${currentPage - 1}__'}" th:title="#{previous}" aria-label="#{previous}">
          <span class="fa fa-step-backward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:each="i: ${#numbers.sequence(1, totalPages)}"
          th:classappend="${currentPage == i} ? 'active'" class="page-item">
        <a class="page-link" th:href="@{'/vets.html?page=__${i}__'}" th:text="${i}">1</a>
      </li>
      <li th:classappend="${currentPage == totalPages} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/vets.html?page=__${currentPage + 1}__'}" th:title="#{next}" aria-label="#{next}">
          <span class="fa fa-step-forward" aria-hidden="true"></span>
        </a>
      </li>
      <li th:classappend="${currentPage == totalPages} ? 'disabled'" class="page-item">
        <a class="page-link" th:href="@{'/vets.html?page=__${totalPages}__'}" th:title="#{last}" aria-label="#{last}">
          <span class="fa fa-fast-forward" aria-hidden="true"></span>
        </a>
      </li>
    </ul>
  </nav>

</body>

</html>
