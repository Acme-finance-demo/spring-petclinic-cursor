<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body})}">
<head>
    <meta charset="UTF-8"/>
    <title>商品編集</title>
</head>
<body>
<h2 th:if="${product.id == null}">新規商品作成</h2>
<h2 th:if="${product.id != null}">商品編集</h2>

<form th:object="${product}" method="post" class="form-horizontal">
    <div class="form-group">
        <label for="name" class="col-sm-2 control-label">商品名</label>
        <div class="col-sm-10">
            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="商品名を入力してください"/>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
        </div>
    </div>
    <div class="form-group">
        <label for="price" class="col-sm-2 control-label">価格</label>
        <div class="col-sm-10">
            <input type="number" th:field="*{price}" class="form-control" id="price" placeholder="価格を入力してください" step="0.01"/>
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></span>
        </div>
    </div>
    <div class="form-group">
        <label for="category" class="col-sm-2 control-label">カテゴリ</label>
        <div class="col-sm-10">
            <select th:field="*{category}" class="form-control" id="category">
                <option value="">選択してください</option>
                <option th:each="cat : ${categories}" th:key="${cat.key}" th:value="${cat.value}" th:text="${cat.value}">カテゴリ</option>
            </select>
            <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger"></span>
        </div>
    </div>
    <div class="form-group">
        <label for="description" class="col-sm-2 control-label">説明</label>
        <div class="col-sm-10">
            <textarea th:field="*{description}" class="form-control" id="description" placeholder="説明を入力してください" rows="4"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></span>
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/products" class="btn btn-default">キャンセル</a>
        </div>
    </div>
</form>

</body>
</html>
