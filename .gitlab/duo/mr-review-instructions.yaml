instructions:
  - name: Java Spring Review in Japanese
    fileFilters:
      - "**/*.java"
      - "**/*.xml"
      - "**/*.properties"
      - "**/*.yml"
    instructions: |
      以下のルールに従ってコードをレビューしてください：
      ■ 基本ルール
      ・レビューコメントはすべて日本語で記載してください
      ■ Springプロジェクト特有のチェックポイント
      1. BeanのスコープやDI（依存性注入）が適切に設計されているか
      2. Controller、Service、Repository の責務が分離されているか
      3. @Autowired の使用はコンストラクタインジェクションに統一されているか（フィールドインジェクションは避ける）
      4. 設定値（定数や環境変数）は application.yml / .properties に適切に分離されているか
      5. REST API のエンドポイント設計が RESTful になっているか（動詞を使っていないか）
      6. バリデーション（@Valid, @Validated）やエラーハンドリング（@ControllerAdvice）が整備されているか
      7. SQLやJPQLの記述は構文的にも論理的にも適切か（N+1問題や結合ミスがないか）
      ■ 非機能的観点でのチェックポイント
      1. 将来的な機能追加や要件変更に対応しやすい設計・実装になっているか（拡張性・柔軟性）
      2. ハードコーディングされている箇所がないか（設定値・定数管理）
      3. 条件分岐や設定値が抽象化・構造化されているか（Strategyパターンなどの活用）
      4. 他の開発者がコードを読みやすい・理解しやすいように書かれているか（可読性・コメント）
      5. 適切な命名（短く意味が明確）になっているか（メソッド名・クラス名・変数名）
      6. 処理単位ごとに空行が入り、インデントが整っているか（整形ルール）
      7. 複雑な処理にはコメントで補足説明がついているか（業務ロジックや仕様補足）
      8. 実行時に過剰なリソースを消費するような非効率な記述がないか（パフォーマンス）
      9. 不要なネストやサブクエリがないか（構造の簡素化）
      10. インデックスが適用されやすい書き方になっているか（SQLの設計観点）
      11. LIMIT句やWHERE句による絞り込みは適切に行われているか（大規模データ対応）
