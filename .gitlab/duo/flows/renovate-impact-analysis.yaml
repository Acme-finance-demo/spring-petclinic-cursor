# .gitlab/duo/flows/renovate-impact-analysis.yaml
# Renovate の依存関係更新 MR の影響範囲を分析して MR にコメント投稿するカスタムフロー。
# 正本（source of truth）。実運用ではこの中身を GitLab の AI > Flows > New flow の
# Configuration エディタに貼り付けて登録し、プロジェクトで Enable する。
# 起動は AI > Triggers のトリガー（推奨: レビュアーの割り当て / Assign reviewer）から。
# スキーマ: flow registry v1（version は "v1"。routers と flow.entry_point は必須）。
version: "v1"
environment: ambient

components:
  - name: "renovate_impact_analyzer"
    type: AgentComponent
    prompt_id: "renovate_impact_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "mr_iid"
    # コメント投稿のみに限定（edit_file / create_commit を渡さない = コード改変不可）。
    toolset:
      - "get_merge_request"
      - "read_file"
      - "list_dir"
      - "find_files"
      - "search_code"
      - "create_merge_request_note"

prompts:
  - prompt_id: "renovate_impact_prompt"
    name: "Renovate Impact Analyzer"
    unit_primitives: []
    prompt_template:
      system: |
        あなたは Spring Boot / Maven プロジェクトにおける依存関係アップグレードの
        影響分析を専門とするレビュー支援エージェントです。
        重要: コードの変更・コミットは一切行わず、分析コメントの投稿のみを行うこと。

        分析結果は create_merge_request_note で日本語コメントとして投稿し、
        必ず次の形式にすること:

        ## 📦 依存関係更新の影響分析

        ### 更新内容
        - ライブラリ: `<group:artifact>` `X.Y.Z → A.B.C`（種別: major/minor/patch, scope: xxx, 直接/推移）

        ### 影響を受けるコード
        - `src/main/java/...#Class.method` — 使い方の説明
          （利用箇所が無ければ「直接の利用箇所は検出されず（推移的依存の可能性）」と明記）

        ### 推奨する再テスト範囲
        - 実行コマンド例と対象テストクラス

        ### 破壊的変更・注意点
        - Release Notes から該当点。無ければ「特筆すべき破壊的変更は見当たりません」。

        ### 総合リスク判定
        - 🟢低 / 🟡中 / 🔴高 と一言の根拠
      user: |
        対象: プロジェクト {{project_id}} のマージリクエスト IID {{mr_iid}}。
        これは Renovate が作成した依存関係更新 MR です。

        次の手順を実行してください:
        1. get_merge_request で MR のタイトル・説明・変更ファイルを取得。
           タイトル/説明から「ライブラリ(group:artifact)」「旧→新バージョン」を特定し、
           Renovate が説明に埋め込む Release Notes / mergeConfidence バッジも読む。
        2. read_file で pom.xml を確認し、直接依存か推移的依存か、scope
           (compile/runtime/test)、更新種別 (major/minor/patch) を判定。
        3. search_code / find_files で、そのライブラリが提供するパッケージ・クラス・
           アノテーションの利用箇所を src/main と src/test から洗い出す。
        4. 「推奨する再テスト範囲」を決める:
           - 直接利用クラスをカバーするテストクラスを特定
           - 更新種別と結合度に応じ、対象を絞った `./mvnw test -Dtest=...` か、
             全体 `./mvnw verify` かを推奨（Spring Boot BOM/starter など横断的更新は広めに）
           - Spring のテストスライス対応の目安:
             *Repository 変更 → @DataJpaTest 系 / *Controller 変更 → @WebMvcTest・MockMvc 系
        5. Release Notes の破壊的変更 (削除/リネームされた API、設定変更、挙動変更) が、
           本プロジェクトの利用箇所に該当するか評価。
        6. 分析結果を create_merge_request_note で投稿。

routers:
  - from: "renovate_impact_analyzer"
    to: "end"

flow:
  entry_point: "renovate_impact_analyzer"
