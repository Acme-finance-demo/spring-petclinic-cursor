# .gitlab/duo-workflows/workflows/renovate-impact-analysis.yml
name: Renovate Impact Analysis
description: Renovateによる依存関係更新の影響範囲を分析してコメント

# MRイベントでトリガー（手動実行も可能）
triggers:
  - merge_request

inputs:
  merge_request_url:
    description: "分析対象のMR URL"
    required: true

goals: |
  このMRはRenovateによる依存関係の更新です。以下を実行してください：
  
  1. MRの差分を確認し、更新されたライブラリとバージョンを特定
  2. プロジェクト内でそのライブラリを使用している箇所を検索
  3. 影響を受けるファイル・クラス・メソッドをリストアップ
  4. 破壊的変更の可能性があるかCHANGELOGやリリースノートを確認
  5. 分析結果をMRにコメントとして投稿
  
  コメントは以下の形式で：
  ## 📦 依存関係更新の影響分析
  
  ### 更新内容
  - ライブラリ名: X.X.X → Y.Y.Y
  
  ### 影響を受けるコード
  - `src/main/java/...` - 使用箇所の説明
  
  ### 注意点
  - 破壊的変更や注意すべき点があれば記載
